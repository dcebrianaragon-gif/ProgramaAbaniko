<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de Interes</title>
  <link rel="stylesheet" href="abaniko-styles.css">
</head>
<body>
  <div class="container">
    <section class="hero"><h1>Datos de interes</h1><p>Asocia informacion complementaria a un alumno existente mediante su DNI.</p></section>
    <section class="panel">
      <div class="button-row" style="margin-bottom: 16px;"><button type="button" class="btn-secondary" onclick="go('menu_anadir_alumno.html')">Volver</button></div>
      <form id="interestForm" class="form-grid">
        <div class="field"><label for="dni">DNI del alumno</label><input id="dni" required></div>
        <div class="field"><label for="objetivos">Objetivos</label><textarea id="objetivos"></textarea></div>
        <div class="field"><label for="observaciones">Observaciones</label><textarea id="observaciones"></textarea></div>
        <div class="field"><label for="referente">Persona referente</label><input id="referente"></div>
        <div class="button-row"><button type="submit" class="btn-primary">Guardar datos</button></div>
      </form>
      <p id="message" class="message"></p>
    </section>
  </div>
  <script src="abaniko-app.js"></script>
  <script>
    function go(page) { window.open(page, "_self"); }
    const form = document.getElementById("interestForm");
    const message = document.getElementById("message");
    const dniInput = document.getElementById("dni");
    const objetivosInput = document.getElementById("objetivos");
    const observacionesInput = document.getElementById("observaciones");
    const referenteInput = document.getElementById("referente");

    function loadStudentSection(dni) {
      const student = AbanikoStore.getStudent(dni);
      if (!student) {
        objetivosInput.value = "";
        observacionesInput.value = "";
        referenteInput.value = "";
        return;
      }

      const interest = student.interest || {};
      objetivosInput.value = interest.objetivos || "";
      observacionesInput.value = interest.observaciones || "";
      referenteInput.value = interest.referente || "";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const dni = dniInput.value.trim().toUpperCase();
      if (!AbanikoStore.getStudent(dni)) {
        message.textContent = "Ese DNI no existe. Crea primero el alumno.";
        return;
      }
      AbanikoStore.patchStudentSection(dni, "interest", {
        objetivos: objetivosInput.value.trim(),
        observaciones: observacionesInput.value.trim(),
        referente: referenteInput.value.trim()
      });
      AbanikoStore.setSelectedStudent(dni);
      message.textContent = "Datos de interes guardados.";
      dniInput.value = dni;
      loadStudentSection(dni);
    });

    dniInput.addEventListener("change", () => loadStudentSection(dniInput.value.trim().toUpperCase()));
    dniInput.addEventListener("blur", () => loadStudentSection(dniInput.value.trim().toUpperCase()));

    const selectedStudent = AbanikoStore.getSelectedStudent();
    if (selectedStudent) {
      dniInput.value = selectedStudent.dni || "";
      loadStudentSection(selectedStudent.dni || "");
    }
  </script>
</body>
</html>
