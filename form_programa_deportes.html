<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa Deportes</title>
  <link rel="stylesheet" href="abaniko-styles.css">
</head>
<body>
  <div class="container">
    <section class="hero"><h1>Programa deportes</h1><p>Guarda preferencias deportivas asociadas a un alumno.</p></section>
    <section class="panel">
      <div class="button-row" style="margin-bottom: 16px;"><button type="button" class="btn-secondary" onclick="go('menu_anadir_alumno.html')">Volver</button></div>
      <form id="sportsForm" class="form-grid">
        <div class="field"><label for="dni">DNI del alumno</label><input id="dni" required></div>
        <div class="field"><label><input id="practica_deporte" type="checkbox"> Practica deporte</label></div>
        <div class="field"><label><input id="gusto_actividad_fisica" type="checkbox"> Le gusta la actividad fisica</label></div>
        <div class="field"><label><input id="gusto_jugar_grupo" type="checkbox"> Le gusta jugar en grupo</label></div>
        <div class="field"><label><input id="entender_seguir_normas" type="checkbox"> Entiende y sigue normas</label></div>
        <div class="button-row"><button type="submit" class="btn-primary">Guardar programa</button></div>
      </form>
      <p id="message" class="message"></p>
    </section>
  </div>
  <script src="firebase-config.js"></script>
  <script src="abaniko-app.js"></script>
  <script>
    AbanikoStore.requireTeacherSession("Index.html");

    function go(page) { window.open(page, "_self"); }
    const form = document.getElementById("sportsForm");
    const message = document.getElementById("message");
    const dniInput = document.getElementById("dni");
    const practicaInput = document.getElementById("practica_deporte");
    const actividadInput = document.getElementById("gusto_actividad_fisica");
    const grupoInput = document.getElementById("gusto_jugar_grupo");
    const normasInput = document.getElementById("entender_seguir_normas");

    function loadStudentSection(dni) {
      const student = AbanikoStore.getStudent(dni);
      if (!student) {
        practicaInput.checked = false;
        actividadInput.checked = false;
        grupoInput.checked = false;
        normasInput.checked = false;
        return;
      }

      const sports = student.sports || {};
      practicaInput.checked = Boolean(sports.practica_deporte);
      actividadInput.checked = Boolean(sports.gusto_actividad_fisica);
      grupoInput.checked = Boolean(sports.gusto_jugar_grupo);
      normasInput.checked = Boolean(sports.entender_seguir_normas);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const dni = dniInput.value.trim().toUpperCase();
      if (!AbanikoStore.getStudent(dni)) {
        message.textContent = "Ese DNI no existe. Crea primero el alumno.";
        return;
      }
      AbanikoStore.patchStudentSection(dni, "sports", {
        practica_deporte: practicaInput.checked,
        gusto_actividad_fisica: actividadInput.checked,
        gusto_jugar_grupo: grupoInput.checked,
        entender_seguir_normas: normasInput.checked
      });
      AbanikoStore.setSelectedStudent(dni);
      message.textContent = "Programa de deportes guardado.";
      dniInput.value = dni;
      loadStudentSection(dni);
    });

    dniInput.addEventListener("change", () => loadStudentSection(dniInput.value.trim().toUpperCase()));
    dniInput.addEventListener("blur", () => loadStudentSection(dniInput.value.trim().toUpperCase()));

    const selectedStudent = AbanikoStore.getSelectedStudent();
    if (selectedStudent) {
      dniInput.value = selectedStudent.dni || "";
      loadStudentSection(selectedStudent.dni || "");
    }
  </script>
</body>
</html>
