<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminar Alumnos</title>
  <link rel="stylesheet" href="abaniko-styles.css">
</head>
<body>
  <div class="container">
    <section class="hero"><h1>Eliminar alumnos</h1><p>Selecciona un alumno y elimÃ­nalo del almacenamiento local.</p></section>
    <section class="panel">
      <div class="button-row" style="margin-bottom: 16px;"><button type="button" class="btn-secondary" onclick="go('Index.html')">Inicio</button></div>
      <div id="studentList" class="list"></div>
      <p id="message" class="message"></p>
    </section>
  </div>
  <script src="firebase-config.js"></script>
  <script src="abaniko-app.js"></script>
  <script>
    AbanikoStore.requireTeacherSession("Index.html");

    function go(page) { window.open(page, "_self"); }
    const studentList = document.getElementById("studentList");
    const message = document.getElementById("message");
    function deleteStudent(dni) {
      AbanikoStore.removeStudent(dni);
      message.textContent = "Alumno eliminado correctamente.";
      renderStudents();
    }
    function renderStudents() {
      const students = AbanikoStore.load().students;
      if (students.length === 0) {
        studentList.innerHTML = '<p class="empty-state">No hay alumnos guardados.</p>';
        return;
      }
      studentList.innerHTML = students.map((student) => `
        <article class="card">
          <div>
            <strong>${AbanikoStore.escapeHtml(student.nombre || "")} ${AbanikoStore.escapeHtml(student.apellidos || "")}</strong>
            <div class="card-lines"><span>DNI: ${AbanikoStore.escapeHtml(student.dni || "")}</span></div>
          </div>
          <div class="actions"><button type="button" class="btn-danger" onclick="deleteStudent('${student.dni}')">Eliminar</button></div>
        </article>
      `).join("");
    }
    window.deleteStudent = deleteStudent;
    renderStudents();
  </script>
</body>
</html>
