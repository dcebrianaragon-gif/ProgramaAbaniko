<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Resumen Selector</title>
  <style>
:root { --bg-top:#f8f1e7; --bg-bottom:#e7d7c2; --surface:rgba(255,251,245,.95); --surface-strong:#fffdfa; --text:#31261e; --muted:#705c4c; --primary:#b85c38; --primary-dark:#8e4327; --success:#2e7d61; --border:rgba(90,63,43,.14); --shadow:0 16px 40px rgba(74,43,28,.14); --radius-xl:28px; --radius-lg:20px; --radius-md:16px; }
* { box-sizing:border-box; } body { margin:0; min-height:100vh; font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif; color:var(--text); background:radial-gradient(circle at top left, rgba(221,179,103,.4), transparent 28%),radial-gradient(circle at bottom right, rgba(184,92,56,.22), transparent 24%),linear-gradient(135deg,var(--bg-top),var(--bg-bottom)); padding:22px 14px 36px; } .container { max-width:1200px; margin:0 auto; } .hero,.panel,.nav-card,.preview-card { background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); } .hero { padding:28px; border-radius:var(--radius-xl); background:linear-gradient(135deg, rgba(184,92,56,.98), rgba(124,59,34,.98)); color:#fff8f2; } .hero h1,.hero p { margin:0; } .hero h1 { font-size:clamp(2rem,4vw,3.2rem); margin-bottom:10px; } .hero p { max-width:820px; line-height:1.6; color:rgba(255,248,242,.88); } .nav-grid,.page-grid,.list,.summary-box,.button-row { display:grid; gap:18px; } .nav-grid { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin:20px 0; } .page-grid { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); } .nav-card,.panel,.preview-card { border-radius:var(--radius-lg); padding:18px; } .help-text,.card-lines span,.list-header p { color:var(--muted); } .help-text { margin:0 0 16px; line-height:1.5; } button { border:none; border-radius:14px; padding:12px 16px; font:inherit; font-weight:700; cursor:pointer; } .btn-primary { color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); } .btn-secondary { color:var(--text); background:rgba(221,179,103,.18); border:1px solid rgba(221,179,103,.55); } .btn-success { color:#fff; background:linear-gradient(135deg,#3a936f,var(--success)); } .list-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:22px 0 12px; } .list-header p { margin:0; } .card { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start; padding:16px; background:var(--surface-strong); border:1px solid rgba(90,63,43,.12); border-radius:var(--radius-md); } .card strong { display:block; margin-bottom:8px; font-size:1.02rem; } .card-lines { display:grid; gap:5px; } .card-lines span { font-size:.93rem; line-height:1.45; } .empty-state { margin:0; padding:18px; text-align:center; color:var(--muted); background:rgba(255,255,255,.45); border:1px dashed rgba(90,63,43,.22); border-radius:var(--radius-md); } .summary-row { padding:14px; border-radius:var(--radius-md); background:var(--surface-strong); border:1px solid rgba(90,63,43,.1); } .summary-row strong { display:block; margin-bottom:4px; } .inline-badge { display:inline-flex; align-items:center; padding:7px 10px; border-radius:999px; background:rgba(221,179,103,.2); color:var(--primary-dark); font-size:.9rem; font-weight:700; }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Selector visual de resúmenes</h1>
      <p>Compara jornadas en una lista y previsualiza el contenido antes de dejar una como resumen actual.</p>
    </section>

    <section class="nav-grid">
      <article class="nav-card"><button type="button" class="btn-secondary" onclick="openLocalPage('seleccionar_resumen.html')">Selector simple</button></article>
      <article class="nav-card"><button type="button" class="btn-secondary" onclick="openLocalPage('ver_resumen_actual.html')">Ver resumen actual</button></article>
      <article class="nav-card"><button type="button" class="btn-secondary" onclick="openLocalPage('registrar_jornada.html')">Gestionar jornadas</button></article>
    </section>

    <section class="page-grid">
      <section class="panel">
        <div class="list-header">
          <h2>Jornadas disponibles</h2>
          <p id="selectorInfo">0 jornadas</p>
        </div>
        <div id="selectorList" class="list"></div>
      </section>

      <section class="preview-card">
        <div id="previewBadge" class="inline-badge">Previsualizacion</div>
        <h2 id="previewTitle" style="margin-top: 14px;">Selecciona una jornada</h2>
        <p id="previewText" class="help-text">Al pulsar sobre una jornada, veras sus datos aqui antes de abrirla.</p>
        <div id="previewBox" class="summary-box"></div>
        <div class="button-row" style="margin-top: 18px;">
          <button id="openSelectedBtn" type="button" class="btn-primary">Abrir resumen</button>
        </div>
      </section>
    </section>
  </div>

  <script>
    const AbanikoStore = (() => {
      const STORAGE_KEY = "programaAbanikoData";
      const SELECTED_SESSION_KEY = "programaAbanikoSelectedSessionId";
      function normalize(data) { return { students: Array.isArray(data?.students) ? data.students : [], teachers: Array.isArray(data?.teachers) ? data.teachers : [], sessions: Array.isArray(data?.sessions) ? data.sessions : [], updatedAt: data?.updatedAt || new Date().toISOString() }; }
      function load() { try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) { const initial = normalize({}); localStorage.setItem(STORAGE_KEY, JSON.stringify(initial)); return initial; } return normalize(JSON.parse(raw)); } catch (error) { console.error("No se pudo cargar la informacion:", error); return normalize({}); } }
      function setSelectedSession(id) { localStorage.setItem(SELECTED_SESSION_KEY, String(id)); }
      function getSelectedSessionId() { return localStorage.getItem(SELECTED_SESSION_KEY); }
      function formatDate(dateValue) { if (!dateValue) { return "Sin fecha"; } const date = new Date(dateValue); if (Number.isNaN(date.getTime())) { return dateValue; } return new Intl.DateTimeFormat("es-ES", { day: "2-digit", month: "long", year: "numeric" }).format(date); }
      function escapeHtml(value) { return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;"); }
      return { load, setSelectedSession, getSelectedSessionId, formatDate, escapeHtml };
    })();

    function openLocalPage(page) {
      window.open(page, "_self");
    }

    const selectorInfo = document.getElementById("selectorInfo");
    const selectorList = document.getElementById("selectorList");
    const previewTitle = document.getElementById("previewTitle");
    const previewText = document.getElementById("previewText");
    const previewBox = document.getElementById("previewBox");
    const openSelectedBtn = document.getElementById("openSelectedBtn");
    let currentPreviewId = null;

    function renderPreview(session) {
      if (!session) {
        currentPreviewId = null;
        previewTitle.textContent = "Selecciona una jornada";
        previewText.textContent = "Al pulsar sobre una jornada, veras sus datos aqui antes de abrirla.";
        previewBox.innerHTML = "";
        return;
      }

      currentPreviewId = session.id;
      previewTitle.textContent = session.title;
      previewText.textContent = "Previsualizacion del resumen que quedara activo.";
      previewBox.innerHTML = `
        <div class="summary-row">
          <strong>Fecha</strong>
          <span>${AbanikoStore.escapeHtml(AbanikoStore.formatDate(session.date))}</span>
        </div>
        <div class="summary-row">
          <strong>Profesor</strong>
          <span>${AbanikoStore.escapeHtml(session.teacherNameSnapshot || "Sin profesor asignado")}</span>
        </div>
        <div class="summary-row">
          <strong>Lugar</strong>
          <span>${AbanikoStore.escapeHtml(session.place || "No indicado")}</span>
        </div>
        <div class="summary-row">
          <strong>Resumen</strong>
          <span>${AbanikoStore.escapeHtml(session.summary || "Sin resumen")}</span>
        </div>
      `;
    }

    function renderSelector() {
      const sessions = [...AbanikoStore.load().sessions].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      selectorInfo.textContent = `${sessions.length} jornadas`;

      if (sessions.length === 0) {
        selectorList.innerHTML = '<p class="empty-state">No hay jornadas disponibles todavia.</p>';
        renderPreview(null);
        return;
      }

      selectorList.innerHTML = sessions.map((session) => `
        <article class="card">
          <div>
            <strong>${AbanikoStore.escapeHtml(session.title)}</strong>
            <div class="card-lines">
              <span>Fecha: ${AbanikoStore.escapeHtml(AbanikoStore.formatDate(session.date))}</span>
              <span>Profesor: ${AbanikoStore.escapeHtml(session.teacherNameSnapshot || "Sin profesor asignado")}</span>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn-secondary" onclick="previewSession(${session.id})">Previsualizar</button>
            <button type="button" class="btn-success" onclick="activateSession(${session.id})">Usar</button>
          </div>
        </article>
      `).join("");

      const selected = sessions.find((item) => String(item.id) === String(AbanikoStore.getSelectedSessionId())) || sessions[0];
      renderPreview(selected);
    }

    function previewSession(id) {
      const session = AbanikoStore.load().sessions.find((item) => String(item.id) === String(id));
      renderPreview(session || null);
    }

    function activateSession(id) {
      AbanikoStore.setSelectedSession(id);
      openLocalPage("ver_resumen_actual.html");
    }

    openSelectedBtn.addEventListener("click", () => {
      if (!currentPreviewId) {
        return;
      }
      activateSession(currentPreviewId);
    });

    window.previewSession = previewSession;
    window.activateSession = activateSession;

    renderSelector();
  </script>
</body>
</html>
