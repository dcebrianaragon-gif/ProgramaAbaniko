<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa Insercion</title>
  <link rel="stylesheet" href="abaniko-styles.css">
</head>
<body>
  <div class="container">
    <section class="hero"><h1>Programa insercion</h1><p>Registra informacion de insercion social o laboral para un alumno ya creado.</p></section>
    <section class="panel">
      <div class="button-row" style="margin-bottom: 16px;"><button type="button" class="btn-secondary" onclick="go('menu_anadir_alumno.html')">Volver</button></div>
      <form id="insertionForm" class="form-grid">
        <div class="field"><label for="dni">DNI del alumno</label><input id="dni" required></div>
        <div class="field"><label for="situacion">Situacion actual</label><input id="situacion"></div>
        <div class="field"><label for="objetivo">Objetivo de insercion</label><textarea id="objetivo"></textarea></div>
        <div class="field"><label for="seguimiento">Seguimiento</label><textarea id="seguimiento"></textarea></div>
        <div class="button-row"><button type="submit" class="btn-primary">Guardar programa</button></div>
      </form>
      <p id="message" class="message"></p>
    </section>
  </div>
  <script src="supabase-config.js"></script>
  <script src="abaniko-app.js"></script>
  <script>
    AbanikoStore.requireTeacherSession("Index.html");

    function go(page) { window.open(page, "_self"); }
    const form = document.getElementById("insertionForm");
    const message = document.getElementById("message");
    const dniInput = document.getElementById("dni");
    const situacionInput = document.getElementById("situacion");
    const objetivoInput = document.getElementById("objetivo");
    const seguimientoInput = document.getElementById("seguimiento");

    function loadStudentSection(dni) {
      const student = AbanikoStore.getStudent(dni);
      if (!student) {
        situacionInput.value = "";
        objetivoInput.value = "";
        seguimientoInput.value = "";
        return;
      }

      const insertion = student.insertion || {};
      situacionInput.value = insertion.situacion || "";
      objetivoInput.value = insertion.objetivo || "";
      seguimientoInput.value = insertion.seguimiento || "";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const dni = dniInput.value.trim().toUpperCase();
      if (!AbanikoStore.getStudent(dni)) {
        message.textContent = "Ese DNI no existe. Crea primero el alumno.";
        return;
      }
      AbanikoStore.patchStudentSection(dni, "insertion", {
        situacion: situacionInput.value.trim(),
        objetivo: objetivoInput.value.trim(),
        seguimiento: seguimientoInput.value.trim()
      });
      AbanikoStore.setSelectedStudent(dni);
      message.textContent = "Programa de insercion guardado.";
      dniInput.value = dni;
      loadStudentSection(dni);
    });

    dniInput.addEventListener("change", () => loadStudentSection(dniInput.value.trim().toUpperCase()));
    dniInput.addEventListener("blur", () => loadStudentSection(dniInput.value.trim().toUpperCase()));

    const selectedStudent = AbanikoStore.getSelectedStudent();
    if (selectedStudent) {
      dniInput.value = selectedStudent.dni || "";
      loadStudentSection(selectedStudent.dni || "");
    }
  </script>
</body>
</html>
