<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa Ocio</title>
  <link rel="stylesheet" href="abaniko-styles.css">
</head>
<body>
  <div class="container">
    <section class="hero"><h1>Programa ocio</h1><p>Guarda aficiones, intereses y propuestas de ocio del alumno.</p></section>
    <section class="panel">
      <div class="button-row" style="margin-bottom: 16px;"><button type="button" class="btn-secondary" onclick="go('menu_anadir_alumno.html')">Volver</button></div>
      <form id="leisureForm" class="form-grid">
        <div class="field"><label for="dni">DNI del alumno</label><input id="dni" required></div>
        <div class="field"><label for="aficiones">Aficiones</label><textarea id="aficiones"></textarea></div>
        <div class="field"><label for="preferencias">Preferencias</label><textarea id="preferencias"></textarea></div>
        <div class="field"><label for="propuesta">Propuesta de ocio</label><textarea id="propuesta"></textarea></div>
        <div class="button-row"><button type="submit" class="btn-primary">Guardar programa</button></div>
      </form>
      <p id="message" class="message"></p>
    </section>
  </div>
  <script src="firebase-config.js"></script>
  <script src="abaniko-app.js"></script>
  <script>
    AbanikoStore.requireTeacherSession("Index.html");

    function go(page) { window.open(page, "_self"); }
    const form = document.getElementById("leisureForm");
    const message = document.getElementById("message");
    const dniInput = document.getElementById("dni");
    const aficionesInput = document.getElementById("aficiones");
    const preferenciasInput = document.getElementById("preferencias");
    const propuestaInput = document.getElementById("propuesta");

    function loadStudentSection(dni) {
      const student = AbanikoStore.getStudent(dni);
      if (!student) {
        aficionesInput.value = "";
        preferenciasInput.value = "";
        propuestaInput.value = "";
        return;
      }

      const leisure = student.leisure || {};
      aficionesInput.value = leisure.aficiones || "";
      preferenciasInput.value = leisure.preferencias || "";
      propuestaInput.value = leisure.propuesta || "";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const dni = dniInput.value.trim().toUpperCase();
      if (!AbanikoStore.getStudent(dni)) {
        message.textContent = "Ese DNI no existe. Crea primero el alumno.";
        return;
      }
      AbanikoStore.patchStudentSection(dni, "leisure", {
        aficiones: aficionesInput.value.trim(),
        preferencias: preferenciasInput.value.trim(),
        propuesta: propuestaInput.value.trim()
      });
      AbanikoStore.setSelectedStudent(dni);
      message.textContent = "Programa de ocio guardado.";
      dniInput.value = dni;
      loadStudentSection(dni);
    });

    dniInput.addEventListener("change", () => loadStudentSection(dniInput.value.trim().toUpperCase()));
    dniInput.addEventListener("blur", () => loadStudentSection(dniInput.value.trim().toUpperCase()));

    const selectedStudent = AbanikoStore.getSelectedStudent();
    if (selectedStudent) {
      dniInput.value = selectedStudent.dni || "";
      loadStudentSection(selectedStudent.dni || "");
    }
  </script>
</body>
</html>
