<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar resumen de salida</title>
  <link rel="stylesheet" href="../css/abaniko-styles.css">
</head>
<body>
  <div class="container">
    <section class="hero"><h1>Seleccionar resumen de salida</h1><p>Busca una salida guardada para ver su resumen o editarla.</p></section>
    <section class="panel section-shell">
      <div class="button-row">
        <button type="button" class="btn-secondary" onclick="go('Index.html')">Inicio</button>
        <button type="button" class="btn-secondary" onclick="go('registrar_jornada.html')">Salidas</button>
      </div>
      <div class="field"><label for="searchInput">Buscar</label><input id="searchInput" type="search" autocomplete="off" placeholder="Nombre, fecha, lugar o profesor"></div>
      <div class="list-header"><h2>Resultados</h2><p id="resultInfo">0 salidas</p></div>
      <div id="sessionList" class="list"></div>
    </section>
  </div>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/abaniko-app.js"></script>
  <script>
    AbanikoStore.requireTeacherSession("Index.html");

    function go(page) { window.open(page, "_self"); }
    const searchInput = document.getElementById("searchInput");
    const resultInfo = document.getElementById("resultInfo");
    const sessionList = document.getElementById("sessionList");
    function openSession(id) {
      AbanikoStore.setSelectedSession(id);
      go("ver_resumen_actual.html");
    }
    function editSession(id) {
      AbanikoStore.setSelectedSession(id);
      AbanikoStore.setSessionToEdit(id);
      go("registrar_jornada.html");
    }
    function normalizeSearch(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }
    function renderSessions() {
      const term = normalizeSearch(searchInput.value.trim());
      const sessions = AbanikoStore.load().sessions
      .filter((session) => {
        const bag = normalizeSearch(`${session.title || ""} ${session.date || ""} ${session.place || ""} ${session.summary || ""} ${session.teacherNameSnapshot || ""}`);
        return bag.includes(term);
      })
      .sort((a, b) => String(b.date || b.updatedAt || "").localeCompare(String(a.date || a.updatedAt || "")));
      resultInfo.textContent = `${sessions.length} salidas`;
      if (sessions.length === 0) {
        sessionList.innerHTML = '<p class="empty-state">No hay salidas que coincidan con la búsqueda. Prueba con el nombre, la fecha, el lugar o el profesor responsable.</p>';
        return;
      }
      sessionList.innerHTML = sessions.map((session) => `
        <article class="card">
          <div>
            <strong>${AbanikoStore.escapeHtml(session.title || "")}</strong>
            <div class="card-lines">
              <span>Fecha: ${AbanikoStore.escapeHtml(AbanikoStore.formatDate(session.date))}</span>
              <span>Profesor: ${AbanikoStore.escapeHtml(session.teacherNameSnapshot || "Sin profesor asignado")}</span>
              <span>Lugar: ${AbanikoStore.escapeHtml(session.place || "No indicado")}</span>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn-success" onclick="openSession(${session.id})">Abrir</button>
            <button type="button" class="btn-secondary" onclick="editSession(${session.id})">Editar</button>
          </div>
        </article>
      `).join("");
    }
    window.openSession = openSession;
    window.editSession = editSession;
    searchInput.addEventListener("input", renderSessions);
    renderSessions();
  </script>
</body>
</html>
