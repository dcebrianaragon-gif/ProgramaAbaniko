<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha del alumno</title>
  <link rel="stylesheet" href="../css/abaniko-styles.css">
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Ficha del alumno</h1>
      <p>Vista completa de la información guardada en la ficha principal, los programas y el histórico asociado al alumno.</p>
    </section>

    <section class="panel section-shell">
      <div class="button-row">
        <button type="button" class="btn-secondary" onclick="go('Consultar_Alumno.html')">Volver</button>
        <button type="button" class="btn-secondary" onclick="editCurrent()">Editar</button>
        <button type="button" class="btn-secondary" onclick="openInterviews()">Entrevistas</button>
      </div>
      <div id="content" class="summary-box"></div>
    </section>
  </div>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/abaniko-app.js"></script>
  <script>
    AbanikoStore.requireTeacherSession("Index.html");

    function go(page) {
      window.open(page, "_self");
    }

    function editCurrent() {
      const student = AbanikoStore.getSelectedStudent();
      if (!student) return;
      AbanikoStore.setStudentToEdit(student.dni);
      go("editar_alumno.html");
    }

    function openInterviews() {
      const student = AbanikoStore.getSelectedStudent();
      if (!student) return;
      AbanikoStore.setSelectedStudent(student.dni);
      go("fichas_entrevista_alumno.html");
    }

    function formatValue(value) {
      if (Array.isArray(value)) {
        return value.length ? value.join(" · ") : "No indicado";
      }
      if (typeof value === "boolean") {
        return value ? "Si" : "No";
      }
      if (value && typeof value === "object") {
        const values = Object.entries(value)
          .filter(([, item]) => item !== "" && item !== null && item !== undefined)
          .map(([key, item]) => `${key}: ${formatValue(item)}`);
        return values.length ? values.join(" | ") : "No indicado";
      }
      return value || "No indicado";
    }

    function row(label, value) {
      return `<div class="summary-row"><strong>${label}</strong><span>${AbanikoStore.escapeHtml(formatValue(value))}</span></div>`;
    }

    function programField(label, value) {
      return `
        <div class="program-detail-item">
          <strong>${AbanikoStore.escapeHtml(label)}</strong>
          <span>${AbanikoStore.escapeHtml(formatValue(value))}</span>
        </div>
      `;
    }

    function hasProgramData(program) {
      return Boolean(program && Object.values(program).some((value) => {
        if (Array.isArray(value)) return value.length > 0;
        if (typeof value === "boolean") return true;
        return value !== "" && value !== null && value !== undefined;
      }));
    }

    function programCard(title, program, fields) {
      if (!hasProgramData(program)) {
        return row(title, "Sin datos guardados");
      }
      return `
        <section class="program-detail-card">
          <div class="program-detail-head">
            <h3>${AbanikoStore.escapeHtml(title)}</h3>
            <span>${AbanikoStore.escapeHtml(program.fecha ? `Fecha: ${program.fecha}` : "Sin fecha")}</span>
          </div>
          <div class="program-detail-grid">
            ${fields.map(([label, key]) => programField(label, program[key])).join("")}
          </div>
        </section>
      `;
    }

    const student = AbanikoStore.getSelectedStudent();
    const content = document.getElementById("content");

    if (!student) {
      content.innerHTML = '<p class="empty-state">No hay ningún alumno seleccionado.</p>';
    } else {
      const interviewRecords = Array.isArray(student.interviewRecords) ? student.interviewRecords : [];
      const latestInterview = interviewRecords.length
        ? AbanikoStore.getLatestInterviewRevision(
            [...interviewRecords].sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")))[0]
          )
        : null;

      const photoBlock = student.foto_alumno
        ? `<div class="student-profile-photo"><img src="${AbanikoStore.escapeHtml(student.foto_alumno)}" alt="Imagen de ${AbanikoStore.escapeHtml(AbanikoStore.getStudentFullName(student))}"></div>`
        : "";

      content.innerHTML = [
        photoBlock,
        row("Nombre", `${student.nombre || ""} ${student.apellidos || ""}`.trim()),
        row("DNI", student.dni),
        row("Fecha de nacimiento", student.fecha_nacimiento),
        row("Edad", student.edad),
        row("Sexo", student.sexo),
        row("Domicilio", student.domicilio),
        row("Localidad", student.localidad),
        row("Provincia", student.provincia),
        row("Teléfono de casa", student.telefono_casa),
        row("Móvil del alumno", student.movil_alumno),
        row("Móvil del padre", student.movil_padre),
        row("Móvil de la madre", student.movil_madre),
        row("Discapacidad", student.discapacidad),
        row("Estudios", student.estudios),
        row("Cursos", student.cursos),
        row("Trabajo", student.trabajo),
        row("Actividad en la que participa", student.actividad_actual),
        row("Actividad deseada", student.actividad_deseada),
        row("Notas del técnico", student.notas_tecnico),
        row("Fichas de entrevista guardadas", interviewRecords.length),
        row("Última entrevista", latestInterview ? `${latestInterview.schoolYear || "Sin curso"} - ${AbanikoStore.formatDate(latestInterview.interviewDate || "")}` : "Sin entrevistas"),
        programCard("Datos de interes", student.interest || {}, [
          ["Objetivos", "objetivos"],
          ["Observaciones", "observaciones"],
          ["Necesidades de apoyo", "necesidades_apoyo"],
          ["Acuerdos", "acuerdos"],
          ["Persona referente", "referente"],
          ["Proxima revision", "proxima_revision"]
        ]),
        programCard("Programa de deportes", student.sports || {}, [
          ["Practica deporte", "practica_deporte"],
          ["Le gusta la actividad fisica", "gusto_actividad_fisica"],
          ["Le gusta jugar en grupo", "gusto_jugar_grupo"],
          ["Entiende y sigue normas", "entender_seguir_normas"],
          ["Actividad principal", "deporte_principal"],
          ["Frecuencia", "frecuencia"],
          ["Apoyos", "apoyos"],
          ["Observaciones", "observaciones"],
          ["Proxima revision", "proxima_revision"]
        ]),
        programCard("Programa de insercion", student.insertion || {}, [
          ["Situacion actual", "situacion"],
          ["Objetivo", "objetivo"],
          ["Seguimiento", "seguimiento"],
          ["Recursos", "recursos"],
          ["Barreras", "barreras"],
          ["Responsable", "responsable"],
          ["Proxima revision", "proxima_revision"]
        ]),
        programCard("Programa de ocio", student.leisure || {}, [
          ["Aficiones", "aficiones"],
          ["Preferencias", "preferencias"],
          ["Propuesta", "propuesta"],
          ["Entorno preferido", "entorno_preferido"],
          ["Apoyos", "apoyos"],
          ["Responsable", "responsable"],
          ["Proxima revision", "proxima_revision"]
        ])
      ].join("");
    }
  </script>
</body>
</html>
