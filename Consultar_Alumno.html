<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Alumnos</title>
  <link rel="stylesheet" href="abaniko-styles.css">
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Consultar alumnos</h1>
      <p>Busca por texto general o usa filtros separados por fecha de nacimiento, edad, sexo y localidad.</p>
    </section>

    <section class="panel section-shell">
      <div class="button-row">
        <button type="button" class="btn-secondary" onclick="go('Index.html')">Inicio</button>
        <button type="button" class="btn-secondary" onclick="go('menu_anadir_alumno.html')">Menú alumno</button>
      </div>

      <div class="filter-grid">
        <div class="field">
          <label for="searchInput">Texto general</label>
          <input id="searchInput" placeholder="Nombre, apellidos, DNI o actividad">
        </div>
        <div class="field">
          <label for="birthInput">Fecha de nacimiento</label>
          <input id="birthInput" type="date">
        </div>
        <div class="field">
          <label for="ageInput">Edad</label>
          <input id="ageInput" type="number" min="0" placeholder="Ej. 16">
        </div>
        <div class="field">
          <label for="sexInput">Sexo</label>
          <select id="sexInput">
            <option value="">Todos</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="field">
          <label for="cityInput">Localidad</label>
          <input id="cityInput" placeholder="Ej. Córdoba">
        </div>
      </div>

      <div class="list-header">
        <h2>Resultados</h2>
        <p id="resultInfo">0 alumnos</p>
      </div>
      <div id="studentList" class="list"></div>
    </section>
  </div>
  <script src="supabase-config.js"></script>
  <script src="abaniko-app.js"></script>
  <script>
    AbanikoStore.requireTeacherSession("Index.html");

    function go(page) { window.open(page, "_self"); }
    const searchInput = document.getElementById("searchInput");
    const birthInput = document.getElementById("birthInput");
    const ageInput = document.getElementById("ageInput");
    const sexInput = document.getElementById("sexInput");
    const cityInput = document.getElementById("cityInput");
    const resultInfo = document.getElementById("resultInfo");
    const studentList = document.getElementById("studentList");

    function openStudent(dni) {
      AbanikoStore.setSelectedStudent(dni);
      go("mostrar_datos_alumnos.html");
    }

    function editStudent(dni) {
      AbanikoStore.setStudentToEdit(dni);
      go("editar_alumno.html");
    }

    function matchesText(student, term) {
      if (!term) return true;
      const bag = `${student.nombre || ""} ${student.apellidos || ""} ${student.dni || ""} ${student.actividad_deseada || ""} ${student.localidad || ""}`.toLowerCase();
      return bag.includes(term);
    }

    function renderStudents() {
      const term = searchInput.value.trim().toLowerCase();
      const birth = birthInput.value;
      const age = ageInput.value.trim();
      const sex = sexInput.value.trim().toLowerCase();
      const city = cityInput.value.trim().toLowerCase();

      const students = AbanikoStore.load().students.filter((student) => {
        if (!matchesText(student, term)) return false;
        if (birth && String(student.fecha_nacimiento || "") !== birth) return false;
        if (age && String(student.edad || "") !== age) return false;
        if (sex && String(student.sexo || "").toLowerCase() !== sex) return false;
        if (city && !String(student.localidad || "").toLowerCase().includes(city)) return false;
        return true;
      });

      resultInfo.textContent = `${students.length} alumnos`;
      if (students.length === 0) {
        studentList.innerHTML = '<p class="empty-state">No hay alumnos que coincidan con los filtros.</p>';
        return;
      }

      studentList.innerHTML = students.map((student) => `
        <article class="card">
          <div>
            <strong>${AbanikoStore.escapeHtml(student.nombre || "")} ${AbanikoStore.escapeHtml(student.apellidos || "")}</strong>
            <div class="card-lines">
              <span>DNI: ${AbanikoStore.escapeHtml(student.dni || "")}</span>
              <span>Fecha de nacimiento: ${AbanikoStore.escapeHtml(student.fecha_nacimiento || "No indicada")}</span>
              <span>Edad: ${AbanikoStore.escapeHtml(student.edad || "No indicada")}</span>
              <span>Sexo: ${AbanikoStore.escapeHtml(student.sexo || "No indicado")}</span>
              <span>Localidad: ${AbanikoStore.escapeHtml(student.localidad || "No indicada")}</span>
              <span>Actividad deseada: ${AbanikoStore.escapeHtml(student.actividad_deseada || "No indicada")}</span>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn-success" onclick="openStudent('${student.dni}')">Ver ficha</button>
            <button type="button" class="btn-secondary" onclick="editStudent('${student.dni}')">Editar</button>
          </div>
        </article>
      `).join("");
    }

    window.openStudent = openStudent;
    window.editStudent = editStudent;
    [searchInput, birthInput, ageInput, sexInput, cityInput].forEach((element) => {
      element.addEventListener("input", renderStudents);
      element.addEventListener("change", renderStudents);
    });

    AbanikoStore.startCloudAutoSync(renderStudents);
    renderStudents();
  </script>
</body>
</html>
